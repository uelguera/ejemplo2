<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja del consultorio</title>
  <link rel="stylesheet" href="/comun.css">
</head>
<body>
  <main>
    <nav class="menu" aria-label="Módulos">
      <span class="marca">Consultorio</span>
      <a href="/caja" aria-current="page">Caja</a>
      <a href="/inventario">Productos</a>
    </nav>
    <div class="cabecera">
      <h1>Caja del consultorio</h1>
    </div>

    <label class="mes">Mes <input id="mes" type="month" required></label>
    <div class="totales">
      <div class="total"><span>Ingresos</span><strong id="ingresos" class="ingreso">—</strong></div>
      <div class="total"><span>Gastos</span><strong id="gastos" class="gasto">—</strong></div>
      <div class="total"><span>Saldo</span><strong id="saldo">—</strong></div>
    </div>
    <p class="medios" id="medios"></p>

    <div class="seccion-cabecera">
      <h2 id="titulo-fijos">Gastos fijos</h2>
      <button id="administrar" type="button" class="enlace">Administrar</button>
    </div>
    <p id="pendiente-fijos" class="pie-seccion"></p>
    <ul id="fijos"></ul>
    <form id="form-fijo" hidden>
      <input id="fijo-nombre" type="text" placeholder="Nombre, p. ej. Alquiler" aria-label="Nombre del gasto fijo" required>
      <input id="fijo-monto" type="number" min="0.01" step="0.01" placeholder="Monto (S/)" aria-label="Monto en soles" required>
      <select id="fijo-categoria" aria-label="Categoría"></select>
      <select id="fijo-medio" aria-label="Medio de pago habitual">
        <option value="efectivo">Efectivo</option>
        <option value="yape">Yape</option>
      </select>
      <input id="fijo-dia" class="ancho" type="number" min="1" max="31" step="1" placeholder="Día de vencimiento (opcional), p. ej. 5" aria-label="Día de vencimiento">
      <div class="ancho botones">
        <button id="fijo-enviar" class="principal">Agregar gasto fijo</button>
        <button id="fijo-cancelar" type="button" hidden>Cancelar</button>
      </div>
    </form>
    <p id="error-fijos" class="error" role="alert"></p>

    <h2>Registrar movimiento</h2>
    <form id="formulario">
      <select id="tipo" aria-label="Tipo">
        <option value="ingreso">Ingreso</option>
        <option value="gasto">Gasto</option>
      </select>
      <input id="monto" type="number" min="0.01" step="0.01" placeholder="Monto (S/)" aria-label="Monto en soles" required>
      <select id="categoria" aria-label="Categoría"></select>
      <select id="medio" aria-label="Medio de pago">
        <option value="efectivo">Efectivo</option>
        <option value="yape">Yape</option>
      </select>
      <input id="fecha" type="date" aria-label="Fecha" required>
      <input id="descripcion" type="text" placeholder="Descripción (sin nombres de pacientes)" aria-label="Descripción">
      <div class="ancho botones">
        <button id="enviar" class="principal">Registrar</button>
        <button id="cancelar" type="button" hidden>Cancelar</button>
      </div>
    </form>
    <p id="error" class="error" role="alert"></p>

    <ul id="lista"></ul>

    <h2>Cierre del día</h2>
    <label class="mes">Día <input id="dia" type="date" required></label>
    <div class="cierre">
      <dl id="cierre-datos"></dl>
      <form id="form-cierre" hidden>
        <input id="contado" type="number" min="0" step="0.01" placeholder="Efectivo contado (S/)" aria-label="Efectivo contado en soles" required>
        <input id="yape-app" type="number" min="0" step="0.01" placeholder="Recibido en Yape según la app (S/)" aria-label="Total recibido en Yape según la app, en soles" required>
        <input id="nota" class="ancho" type="text" placeholder="Nota (opcional), p. ej. di mal un vuelto" aria-label="Nota">
        <button class="principal ancho">Cerrar el día</button>
      </form>
      <button id="reabrir" type="button" hidden>Reabrir día para corregirlo</button>
    </div>
    <p id="error-cierre" class="error" role="alert"></p>
  </main>

  <script src="/comun.js"></script>
  <script>
    // Módulo Caja: usa la API de servidor/caja.py (la misma que cliente/caja.js).
    // pedir, soles, $, hoy, mayuscula, boton, CATEGORIAS y MEDIOS vienen de /comun.js.
    const lista = $("lista");
    const error = $("error");
    const errorCierre = $("error-cierre");
    const errorFijos = $("error-fijos");
    let administrando = false; // true: la lista de gastos fijos muestra Editar/Eliminar en vez de Pagar
    let editandoFijo = null; // id de la plantilla cargada en el formulario de gastos fijos
    let editando = null; // id del movimiento cargado en el formulario, o null si se registra uno nuevo
    let diasCerrados = new Set(); // fechas cerradas del mes mostrado: sus movimientos no se pueden tocar

    // accion(cambio, destino): hace el cambio, muestra el error si lo hay y vuelve a pintar todo.
    const accion = crearAccion(cargar, [error, errorCierre, errorFijos]);

    async function cargar() {
      const mes = $("mes").value;
      const [movimientos, resumen, cierres, gastosFijos] = await Promise.all([
        pedir("GET", `/movimientos?mes=${mes}`),
        pedir("GET", `/resumen?mes=${mes}`),
        pedir("GET", `/cierres?mes=${mes}`),
        pedir("GET", `/gastos-fijos?mes=${mes}`),
        cargarCierre(),
      ]);
      diasCerrados = new Set(cierres.map((c) => c.fecha));
      mostrarGastosFijos(gastosFijos, mes);
      $("ingresos").textContent = soles.format(resumen.ingresos);
      $("gastos").textContent = soles.format(resumen.gastos);
      $("saldo").textContent = soles.format(resumen.saldo);
      $("saldo").className = resumen.saldo < 0 ? "gasto" : "";
      $("medios").textContent = Object.entries(resumen.por_medio)
        .map(([medio, t]) => `${mayuscula(medio)}: ${soles.format(t.saldo)}`)
        .join(" · ");

      if (movimientos.length) {
        lista.replaceChildren(...movimientos.map(crearFila));
      } else {
        const vacio = document.createElement("li");
        vacio.className = "vacio";
        vacio.textContent = "No hay movimientos este mes.";
        lista.replaceChildren(vacio);
      }
    }

    function crearFila(m) {
      const fila = document.createElement("li");
      fila.classList.toggle("editando", m.id === editando);

      const fecha = document.createElement("span");
      fecha.className = "fecha";
      const [, mesNum, dia] = m.fecha.split("-");
      fecha.textContent = `${dia}/${mesNum}`;

      // textContent: la descripción nunca se interpreta como HTML
      const detalle = document.createElement("span");
      detalle.className = "detalle";
      detalle.textContent = mayuscula(m.categoria);
      const extra = document.createElement("small");
      extra.textContent = [mayuscula(m.medio), m.descripcion].filter(Boolean).join(" · ");
      detalle.append(extra);

      const monto = document.createElement("span");
      monto.className = `monto ${m.tipo}`;
      monto.textContent = `${m.tipo === "gasto" ? "−" : "+"} ${soles.format(m.monto)}`;

      if (diasCerrados.has(m.fecha)) {
        const candado = document.createElement("span");
        candado.className = "candado";
        candado.textContent = "🔒 Día cerrado";
        fila.append(fecha, detalle, monto, candado);
        return fila;
      }

      const borrar = document.createElement("button");
      borrar.type = "button";
      borrar.className = "borrar";
      borrar.textContent = "Eliminar";
      borrar.setAttribute("aria-label", `Eliminar ${m.tipo} de ${soles.format(m.monto)} del ${fecha.textContent}`);
      borrar.addEventListener("click", () => accion(async () => {
        await pedir("DELETE", `/movimientos/${m.id}`);
        if (m.id === editando) terminarEdicion();
      }));

      const editar = document.createElement("button");
      editar.type = "button";
      editar.textContent = "Editar";
      editar.setAttribute("aria-label", `Editar ${m.tipo} de ${soles.format(m.monto)} del ${fecha.textContent}`);
      editar.addEventListener("click", () => empezarEdicion(m, fila));

      fila.append(fecha, detalle, monto, editar, borrar);
      return fila;
    }

    function llenarCategorias() {
      $("categoria").replaceChildren(...CATEGORIAS[$("tipo").value].map((c) => new Option(mayuscula(c), c)));
    }

    // Carga el movimiento en el formulario; al guardar se envía como PATCH en vez de POST.
    function empezarEdicion(m, fila) {
      editando = m.id;
      $("tipo").value = m.tipo;
      llenarCategorias();
      $("categoria").value = m.categoria;
      $("monto").value = m.monto;
      $("medio").value = m.medio;
      $("fecha").value = m.fecha;
      $("descripcion").value = m.descripcion;
      $("enviar").textContent = "Guardar cambios";
      $("cancelar").hidden = false;
      error.textContent = "";
      for (const otra of lista.children) otra.classList.toggle("editando", otra === fila);
      $("formulario").scrollIntoView({ behavior: "smooth", block: "center" });
      $("monto").focus({ preventScroll: true });
    }

    // Vuelve al modo "registrar": limpia monto y descripción, conserva tipo, medio y fecha.
    function terminarEdicion() {
      editando = null;
      $("monto").value = "";
      $("descripcion").value = "";
      $("enviar").textContent = "Registrar";
      $("cancelar").hidden = true;
      for (const fila of lista.children) fila.classList.remove("editando");
    }

    // ---- Gastos fijos ----

    function nombreDelMes(mes) {
      const [anio, numero] = mes.split("-").map(Number);
      return new Date(anio, numero - 1, 1).toLocaleDateString("es-PE", { month: "long" });
    }

    function ultimoDia(mes) {
      const [anio, numero] = mes.split("-").map(Number);
      return new Date(anio, numero, 0).getDate(); // día 0 del mes siguiente = último del mes
    }

    // Fecha de vencimiento en ese mes (el día 31 en un mes de 30 días pasa al 30; sin día, el último).
    function fechaDeVencimiento(g, mes) {
      const dia = Math.min(g.dia ?? ultimoDia(mes), ultimoDia(mes));
      return `${mes}-${String(dia).padStart(2, "0")}`;
    }

    function mostrarGastosFijos(gastos, mes) {
      $("titulo-fijos").textContent = `Gastos fijos de ${nombreDelMes(mes)}`;
      const pendientes = gastos.filter((g) => !g.pagado);
      const total = pendientes.reduce((suma, g) => suma + Math.round(g.monto * 100), 0) / 100; // en céntimos
      $("pendiente-fijos").textContent = !gastos.length ? ""
        : pendientes.length ? `Por pagar: ${soles.format(total)} (${pendientes.length} de ${gastos.length})`
        : "Todo pagado ✓";
      if (gastos.length) {
        $("fijos").replaceChildren(...gastos.map((g) => filaGastoFijo(g, mes)));
      } else {
        const vacio = document.createElement("li");
        vacio.className = "vacio";
        vacio.textContent = "No tienes gastos fijos. Pulsa «Administrar» para agregar el alquiler, la luz…";
        $("fijos").replaceChildren(vacio);
      }
    }

    function filaGastoFijo(g, mes) {
      const fila = document.createElement("li");

      const detalle = document.createElement("span");
      detalle.className = "detalle";
      detalle.textContent = g.nombre;
      const extra = document.createElement("small");
      const vencido = !g.pagado && g.dia !== null && fechaDeVencimiento(g, mes) < hoy();
      extra.textContent = [mayuscula(g.categoria), mayuscula(g.medio), g.dia ? `vence el ${g.dia}` : "", vencido ? "vencido" : ""]
        .filter(Boolean).join(" · ");
      if (vencido) extra.classList.add("descuadre");
      detalle.append(extra);

      const monto = document.createElement("span");
      monto.className = "monto gasto";
      monto.textContent = soles.format(g.monto);
      fila.append(detalle, monto);

      if (administrando) {
        fila.classList.toggle("editando", g.id === editandoFijo);
        fila.append(
          boton("Editar", () => empezarEdicionFijo(g, fila)),
          boton("Eliminar", () => accion(async () => {
            await pedir("DELETE", `/gastos-fijos/${g.id}`);
            if (g.id === editandoFijo) terminarEdicionFijo();
          }, errorFijos), "borrar"),
        );
      } else if (g.pagado) {
        const pagado = document.createElement("span");
        pagado.className = "pagado";
        const [, mesNum, dia] = g.movimiento.fecha.split("-");
        pagado.textContent = `✓ Pagado el ${dia}/${mesNum}`;
        fila.append(pagado);
      } else {
        const pagar = boton("Pagar", () => mostrarPago(fila, pagar, g, mes), "principal");
        fila.append(pagar);
      }
      return fila;
    }

    // Cambia el botón Pagar por la fecha y el medio del pago, con Confirmar y Cancelar.
    function mostrarPago(fila, pagar, g, mes) {
      const fecha = document.createElement("input");
      fecha.type = "date";
      fecha.required = true;
      fecha.value = mes === hoy().slice(0, 7) ? hoy() : fechaDeVencimiento(g, mes);
      fecha.setAttribute("aria-label", `Fecha de pago de ${g.nombre}`);

      const medio = document.createElement("select");
      medio.replaceChildren(...MEDIOS.map((m) => new Option(mayuscula(m), m)));
      medio.value = g.medio;
      medio.setAttribute("aria-label", `Medio de pago de ${g.nombre}`);

      const pago = document.createElement("span");
      pago.className = "pago";
      pago.append(
        fecha,
        medio,
        boton("Confirmar pago", () => accion(() =>
          pedir("POST", `/gastos-fijos/${g.id}/pagar`, { fecha: fecha.value, medio: medio.value }), errorFijos), "principal"),
        boton("Cancelar", () => accion(() => {}, errorFijos)),
      );
      fila.classList.add("pagando");
      pagar.replaceWith(pago);
      fecha.focus();
    }

    function llenarCategoriasFijo() {
      $("fijo-categoria").replaceChildren(...CATEGORIAS.gasto.map((c) => new Option(mayuscula(c), c)));
    }

    function empezarEdicionFijo(g, fila) {
      editandoFijo = g.id;
      $("fijo-nombre").value = g.nombre;
      $("fijo-monto").value = g.monto;
      $("fijo-categoria").value = g.categoria;
      $("fijo-medio").value = g.medio;
      $("fijo-dia").value = g.dia ?? "";
      $("fijo-enviar").textContent = "Guardar cambios";
      $("fijo-cancelar").hidden = false;
      errorFijos.textContent = "";
      for (const otra of $("fijos").children) otra.classList.toggle("editando", otra === fila);
      $("fijo-nombre").focus();
    }

    function terminarEdicionFijo() {
      editandoFijo = null;
      $("form-fijo").reset();
      llenarCategoriasFijo();
      $("fijo-enviar").textContent = "Agregar gasto fijo";
      $("fijo-cancelar").hidden = true;
      for (const fila of $("fijos").children) fila.classList.remove("editando");
    }

    $("administrar").addEventListener("click", () => {
      administrando = !administrando;
      $("administrar").textContent = administrando ? "Listo" : "Administrar";
      $("form-fijo").hidden = !administrando;
      terminarEdicionFijo();
      accion(() => {}, errorFijos);
      if (administrando) $("fijo-nombre").focus();
    });
    $("fijo-cancelar").addEventListener("click", () => { terminarEdicionFijo(); errorFijos.textContent = ""; });

    $("form-fijo").addEventListener("submit", (e) => {
      e.preventDefault();
      accion(async () => {
        const datos = {
          nombre: $("fijo-nombre").value,
          monto: $("fijo-monto").value,
          categoria: $("fijo-categoria").value,
          medio: $("fijo-medio").value,
          dia: $("fijo-dia").value,
        };
        if (editandoFijo === null) {
          await pedir("POST", "/gastos-fijos", datos);
        } else {
          await pedir("PATCH", `/gastos-fijos/${editandoFijo}`, datos);
        }
        terminarEdicionFijo();
        $("fijo-nombre").focus();
      }, errorFijos);
    });

    // ---- Cierre del día ----

    // Diferencia = lo contado (o lo que dice la app) − lo registrado. Mismo texto que el CLI.
    function describirDiferencia(diferencia, medio) {
      if (diferencia === 0) return { texto: "Cuadra", clase: "cuadra" };
      const monto = soles.format(Math.abs(diferencia));
      if (medio === "yape") {
        return diferencia > 0
          ? { texto: `En la app hay ${monto} sin registrar`, clase: "descuadre" }
          : { texto: `${monto} registrados que no están en la app`, clase: "descuadre" };
      }
      return diferencia > 0
        ? { texto: `Sobran ${monto}`, clase: "descuadre" }
        : { texto: `Faltan ${monto}`, clase: "falta" };
    }

    // Pinta pares "nombre: valor" en la lista de datos del cierre. valor puede ser texto o {texto, clase}.
    function mostrarDatosCierre(pares) {
      const elementos = pares.flatMap(([nombre, valor]) => {
        const dt = document.createElement("dt");
        dt.textContent = nombre;
        const dd = document.createElement("dd");
        if (typeof valor === "string") {
          dd.textContent = valor;
        } else {
          dd.textContent = valor.texto;
          dd.className = `resultado ${valor.clase}`;
        }
        return [dt, dd];
      });
      $("cierre-datos").replaceChildren(...elementos);
    }

    async function cargarCierre() {
      const c = await pedir("GET", `/cierre?fecha=${$("dia").value}`);
      $("form-cierre").hidden = c.cerrado;
      $("reabrir").hidden = !c.cerrado;
      if (!c.cerrado) {
        mostrarDatosCierre([
          ["Cobrado en efectivo", soles.format(c.efectivo.ingresos)],
          ["Gastado en efectivo", `− ${soles.format(c.efectivo.gastos)}`],
          ["Efectivo que debería haber", { texto: soles.format(c.efectivo.esperado), clase: "" }],
          ["Recibido por Yape (registrado)", soles.format(c.yape.ingresos)],
        ]);
        return;
      }
      mostrarDatosCierre([
        ["Efectivo esperado", soles.format(c.efectivo.esperado)],
        ["Efectivo contado", soles.format(c.efectivo.contado)],
        ["Efectivo", describirDiferencia(c.efectivo.diferencia, "efectivo")],
        ["Yape registrado", soles.format(c.yape.ingresos)],
        ["Yape según la app", soles.format(c.yape.app)],
        ["Yape", describirDiferencia(c.yape.diferencia, "yape")],
        ...(c.nota ? [["Nota", c.nota]] : []),
        ["Cerrado el", c.cerrado_en.replace("T", " ").slice(0, 16)],
      ]);
    }

    $("form-cierre").addEventListener("submit", (e) => {
      e.preventDefault();
      accion(async () => {
        await pedir("POST", "/cierres", {
          fecha: $("dia").value,
          efectivo_contado: $("contado").value,
          yape_app: $("yape-app").value,
          nota: $("nota").value,
        });
        $("contado").value = $("yape-app").value = $("nota").value = "";
      }, errorCierre);
    });
    $("reabrir").addEventListener("click", () =>
      accion(() => pedir("DELETE", `/cierres/${$("dia").value}`), errorCierre));
    $("dia").addEventListener("change", () => { if ($("dia").value) accion(() => {}, errorCierre); });

    $("tipo").addEventListener("change", llenarCategorias);
    $("mes").addEventListener("change", () => { if ($("mes").value) accion(() => {}); });
    $("cancelar").addEventListener("click", () => { terminarEdicion(); error.textContent = ""; });

    $("formulario").addEventListener("submit", (e) => {
      e.preventDefault();
      accion(async () => {
        const datos = {
          tipo: $("tipo").value,
          monto: $("monto").value,
          categoria: $("categoria").value,
          medio: $("medio").value,
          fecha: $("fecha").value,
          descripcion: $("descripcion").value,
        };
        const movimiento = editando === null
          ? await pedir("POST", "/movimientos", datos)
          : await pedir("PATCH", `/movimientos/${editando}`, datos);
        $("mes").value = movimiento.fecha.slice(0, 7); // muestra el mes donde quedó el movimiento
        terminarEdicion();
        $("monto").focus();
      });
    });

    $("fecha").value = hoy();
    $("mes").value = hoy().slice(0, 7);
    $("dia").value = $("dia").max = hoy(); // no se puede cerrar un día que aún no llega
    llenarCategorias();
    llenarCategoriasFijo();
    accion(() => {});
  </script>
</body>
</html>
